<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="immigration.css">
    </head>
    <body>
        <div class="container">
            <a href="../home.html" class="logo">
                <img src="../resources/imgs/Document.png" width=40px>
                <p>Framstad</p>
            </a>

            <div class="nav-bar">
                <a href="industries.html">industries</a>
                <a href="immigration.html">immigration</a>
                <a href="resources.html">resources</a>
            </div>
        </div>

        <div class="title">
            <h1 style="font-size:80px; font-family:'Space Grotesk'">Immigration</h1>
            <p>Discover the pathways to becoming a part of Framstad's thriving community.</p>
        </div>

        <script>
            let lastScrollTop = 0;
            let isHidden = false;
            const container = document.querySelector('.container');

            window.addEventListener('scroll', () => {
                let currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                
                if (currentScroll > 300) {
                    if (currentScroll > lastScrollTop && !isHidden) {
                        container.classList.remove('visible');
                        container.classList.add('hidden');
                        isHidden = true;
                    } else if (currentScroll < lastScrollTop && isHidden) {
                        container.classList.remove('hidden');
                        container.classList.add('visible');
                        isHidden = false;
                    }
                } else {
                    if (isHidden) {
                        container.classList.remove('hidden');
                        container.classList.add('visible');
                        isHidden = false;
                    }
                }
                
                lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
            });
        </script>
    </body>
</html>
